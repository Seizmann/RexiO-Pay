name: android

on:
  push:
    branches: [main]
    paths: ["apps/android/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fail hard on lint or unit tests — no APK gets built or delivered
      # unless everything is green.
      - name: Lint and unit tests
        run: ./gradlew lint testReleaseUnitTest --no-daemon

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rexio-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rexio-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Deliver APK via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          CAPTION="RexiO Pay Engine ${VERSION_NAME} (${VERSION_CODE})
          commit: ${GITHUB_SHA:0:8}
          $(git log -1 --pretty=%s | cut -c1-80)"
          RESPONSE=$(curl -sS \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK}" \
            --form-string "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rexio-release.keystore"
