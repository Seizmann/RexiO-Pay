# VPS deployment: docker compose up -d
# Caddy serves api.pay.rexio.pro (auto-TLS) -> backend.
# Redis: rate limiting + SSE fan-out (optional in MVP; backend falls back to in-memory).

services:
  backend:
    build: ./apps/backend
    restart: unless-stopped
    env_file:
      - path: /srv/rexio-pay/backend.env
        required: false # VPS secret file; local override supplies ./apps/backend/.env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

volumes:
  caddy_data:
  caddy_config:
